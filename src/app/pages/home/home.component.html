<app-carousel [events]="eventThrees"></app-carousel>

<div class="dark:bg-gray-900 mx-auto pt-10">
  <div class="max-w-2x1 mx-auto text-center mb-5 lg:mb-5">
    <h1 class="text-5xl text-extrabold text-purple-600">Evenements à la une</h1>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 mx-auto gap-4 p-4 place-items-center justify-items-center">
    <app-event-card [event]="event" *ngFor="let event of eventThrees"></app-event-card>
  </div>
  <div *ngIf="isLogged" class="max-w-2x1 mx-auto text-center mb-5 lg:mb-5">
    <h1 class="text-5xl text-extrabold text-purple-600">Evenements liées à vos centres d'intérets</h1>
  </div>
  <div *ngIf="isLogged" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 mx-auto gap-4 p-4 place-items-center justify-items-center">
    <app-event-card [event]="event" *ngFor="let event of eventInterets"></app-event-card>
  </div>
</div>
