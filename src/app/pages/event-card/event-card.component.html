<a [routerLink]="['/event', event?.id]"
  class="relative bg-white rounded-lg shadow-md h-85 w-80 overflow-hidden hover:shadow-xl transition dark:bg-gray-900 dark:text-white dark:border dark:border-gray-700">
  <img [src]="baseUrl +event?.media?.url"  alt="Event Image" class="w-80 h-50 object-cover brightness-75" (error)="handleImageError($event)" alt="Image de l'événement" />
  <div class="h-35 w-80">
    <div class="flex rounded-2xl bg-[#f6f4ee] h-full w-full shadow-lg overflow-hidden relative">
      <div class="flex flex-col justify-between px-5 py-4 relative h-full w-full">
        <span class="flex justify-between items-center">
          <span class="text-sm uppercase tracking-widest text-gray-700 mb-2 gap-3 flex justify-right items-center w-20 h-8 z-10">
            <span (click)="toggleFavorite($event)" class="w-8 h-8">
              <svg *ngIf="isFavorited" class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="m12.75 20.66 6.184-7.098c2.677-2.884 2.559-6.506.754-8.705-.898-1.095-2.206-1.816-3.72-1.855-1.293-.034-2.652.43-3.963 1.442-1.315-1.012-2.678-1.476-3.973-1.442-1.515.04-2.825.76-3.724 1.855-1.806 2.201-1.915 5.823.772 8.706l6.183 7.097c.19.216.46.34.743.34a.985.985 0 0 0 .743-.34Z" />
              </svg>
              <svg *ngIf="!isFavorited"  class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z" />
              </svg>
            </span>
            <span (click)="toggleSuscribe($event)"  class="w-8 h-8">
              <svg *ngIf="isSusccribed" class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd"
                  d="M18 5.05h1a2 2 0 0 1 2 2v2H3v-2a2 2 0 0 1 2-2h1v-1a1 1 0 1 1 2 0v1h3v-1a1 1 0 1 1 2 0v1h3v-1a1 1 0 1 1 2 0v1Zm-15 6v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8H3ZM11 18a1 1 0 1 0 2 0v-1h1a1 1 0 1 0 0-2h-1v-1a1 1 0 1 0-2 0v1h-1a1 1 0 1 0 0 2h1v1Z"
                  clip-rule="evenodd" />
              </svg>
              <svg *ngIf="!isSusccribed" class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" fill="none" viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M4 9.05H3v2h1v-2Zm16 2h1v-2h-1v2ZM10 14a1 1 0 1 0 0 2v-2Zm4 2a1 1 0 1 0 0-2v2Zm-3 1a1 1 0 1 0 2 0h-2Zm2-4a1 1 0 1 0-2 0h2Zm-2-5.95a1 1 0 1 0 2 0h-2Zm2-3a1 1 0 1 0-2 0h2Zm-7 3a1 1 0 0 0 2 0H6Zm2-3a1 1 0 1 0-2 0h2Zm8 3a1 1 0 1 0 2 0h-2Zm2-3a1 1 0 1 0-2 0h2Zm-13 3h14v-2H5v2Zm14 0v12h2v-12h-2Zm0 12H5v2h14v-2Zm-14 0v-12H3v12h2Zm0 0H3a2 2 0 0 0 2 2v-2Zm14 0v2a2 2 0 0 0 2-2h-2Zm0-12h2a2 2 0 0 0-2-2v2Zm-14-2a2 2 0 0 0-2 2h2v-2Zm-1 6h16v-2H4v2ZM10 16h4v-2h-4v2Zm3 1v-4h-2v4h2Zm0-9.95v-3h-2v3h2Zm-5 0v-3H6v3h2Zm10 0v-3h-2v3h2Z" />
              </svg>
            </span>
          </span>
          <span class="text-sm font-bold text-black mb-2"> {{ event?.date_time_start}}</span>
        </span>
        <div class="uppercase text-lg font-semibold tracking-tight text-black">
         {{ event?.title }}
        </div>
        <!-- Découpe ticket gauche -->
        <div class="absolute left-0 top-1/2 -translate-y-1/2 w-4 h-8 bg-purple-600 rounded-full -ml-2"></div>
      </div>
    </div>
  </div>
</a>
